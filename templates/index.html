{% extends "base.html" %}

{% block content %}
    {% for meme in memes_list %}
        {% if (loop.index + 1) % 3 == 0 %}
            <div class="row">
        {% endif %}

        <div class="meme-card one-third column">
            <img src="{{ url_for('static', filename=meme) }}" class="meme-image">
        </div>

        {% if (loop.index + 1) % 3 == 0 %}
            </div>
        {% endif %}
    {% endfor %}
{% endblock %}
